[project]
name = "skoda_api_ha"
version = "0.11.1"
description = "Home Assistant custom integration for the official MyŠkoda Public API"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/skoda_api_ha"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
