name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run against the newest Home Assistant test package.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Offline only: fake VIN and key, mocked HTTP (aioclient_mock). Never calls
# the Škoda API.
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  pytest-latest-ha:
    # Catches breaking Home Assistant changes early (weekly and on demand).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install --upgrade pytest-homeassistant-custom-component pytest-cov
      - run: pip show homeassistant | head -2
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS / Marketplace validation. hacs/action validates only public
    # repositories, so the job is skipped while the repository is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
