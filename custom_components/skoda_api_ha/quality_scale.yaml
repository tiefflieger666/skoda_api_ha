# Integration Quality Scale, see
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/
# Rule list taken from Home Assistant 2026.10. Status as of 0.11.1.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No integration actions; commands are entities (button, switch, select, number).
  appropriate-polling: done
  brands:
    status: done
    comment: icon.png and icon@2x.png in custom_components/skoda_api_ha/brand/ (Home Assistant 2026.3+).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No requirements yet; the client lives in api.py without Home Assistant imports.
  docs-actions:
    status: exempt
    comment: No integration actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: done
    comment: >-
      Entities subscribe only through the coordinator. The optional charger
      power sensor is watched by the coordinator (charger_meter.py) and the
      listener is removed on unload.
  entity-unique-id:
    status: done
    comment: unique_id is <VIN>_<entity key>.
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud API; nothing to discover.
  discovery:
    status: exempt
    comment: Cloud API; nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one vehicle (VIN).
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: >-
      All icons are in icons.json. Only a control with a command waiting for
      confirmation overrides its icon with an hourglass (icon translations
      cannot follow a state attribute).
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: >-
      Done: repair issue when a new API key (reconfigure) is rejected.
      Todo: repair issue 14 and 3 days before the API key expires.
  stale-devices:
    status: exempt
    comment: One config entry is one vehicle (VIN); removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
